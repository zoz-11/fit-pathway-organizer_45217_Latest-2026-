version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      radix-ui:
        patterns:
          - '@radix-ui/*'
      testing:
        patterns:
          - '@testing-library/*'
          - '@types/jest'
          - 'jest*'
          - 'babel*'
          - 'ts-jest'
      typescript:
        patterns:
          - 'typescript*'
          - '@typescript-eslint/*'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'rollup'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
