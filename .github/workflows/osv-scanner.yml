name: OSV Dependency Scan

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Run OSV Scanner
        uses: google/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=package-lock.json
